<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zug Grafing</title>
<meta name="theme-color" content="#0b6bcb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zug">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--acc:#0b6bcb;--ok:#1a8f3c;--late:#d1342f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--mut:#a1a1a6;--line:#2c2c2e;--acc:#4ea1ff;--ok:#3ccf6a;--late:#ff6961}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px 32px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;margin:18px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
.dirs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.dirs button{flex:1;border:0;background:none;color:var(--fg);font:inherit;font-weight:600;padding:9px;border-radius:10px;cursor:pointer}
.dirs button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:16px;padding:4px 14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 4px}
.conn{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.card h2+.conn{border-top:0}
.conn.gone{opacity:.45}
.ct{min-width:56px}.ct b{font-size:20px;display:block}.ct s{color:var(--mut);font-size:13px}
.ci{flex:1;min-width:0}.ci b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci span{color:var(--mut);font-size:14px}
.line{display:inline-block;background:#408335;color:#fff;border-radius:6px;padding:0 6px;font-size:13px;font-weight:700;margin-right:4px}
.ci .line{color:#fff;font-size:13px}
.line.r{background:#6b6b6b}.line.u{background:#0065ae}.line.t{background:#d82020}.line.b{background:#00586a}
.ok{color:var(--ok)}.late{color:var(--late);font-weight:600}
.msg{color:var(--mut);padding:16px 0}
.err{color:var(--late)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;padding:12px;cursor:pointer}
a{color:var(--acc)}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Zug</h1>
<p class="sub"><span id="route"></span><span id="upd"></span></p>
<div class="dirs"><button data-dir="hin">Zur Hochschule</button><button data-dir="rueck">Nach Hause</button></div>
<div class="card" id="conns"></div>
<div class="card" id="board"></div>
<button class="btn" id="refresh">Aktualisieren</button>
<p class="foot">Live-Daten der Deutschen Bahn über transport.rest · aktualisiert sich jede Minute</p>
</main>
<script>
/* Einstellungen: über die Adresse änderbar, z. B. ?home=Ebersberg */
var P=new URLSearchParams(location.search);
var CFG={
  home:P.get('home')||'Grafing Bahnhof',
  dest:P.get('dest')||'Hochschule München, Lothstraße 34',
  lat:+(P.get('lat')||48.15466),lon:+(P.get('lon')||11.55374),
  api:'https://v6.db.transport.rest'
};
var st={dir:null,ids:{}};
try{st.ids=JSON.parse(localStorage.getItem('zug_ids')||'{}')}catch(e){}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hhmm(iso){if(!iso)return'';var d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function lineCls(n){n=String(n||'');return /^S/.test(n)?'':/^U/.test(n)?'u':/^(Tram|STR)/i.test(n)?'t':/^Bus/i.test(n)?'b':'r'}
function api(path){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},12000);
  return fetch(CFG.api+path,{signal:ctl.signal}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('Server antwortet nicht ('+r.status+')');return r.json()});
}
/* Ein Fehler beim Bahn-Server ist oft nur kurz: einmal nach 2 s neu versuchen */
function apiRetry(path){return api(path).catch(function(){return new Promise(function(r){setTimeout(r,2000)}).then(function(){return api(path)})})}
function station(q){
  if(st.ids[q])return Promise.resolve(st.ids[q]);
  return apiRetry('/locations?query='+encodeURIComponent(q)+'&results=1&addresses=false&poi=false').then(function(r){
    if(!r[0])throw new Error('Haltestelle „'+q+'“ nicht gefunden');
    st.ids[q]={id:r[0].id,name:r[0].name};try{localStorage.setItem('zug_ids',JSON.stringify(st.ids))}catch(e){}
    return st.ids[q];
  });
}
function autoDir(){return new Date().getHours()<13?'hin':'rueck'}
function dest(prefix){return prefix+'address='+encodeURIComponent(CFG.dest)+'&'+prefix+'latitude='+CFG.lat+'&'+prefix+'longitude='+CFG.lon}
function journeyHtml(j,now){
  var legs=(j.legs||[]).filter(function(l){return !l.walking}),f=legs[0],a=j.legs[0],z=j.legs[j.legs.length-1];if(!f)return'';
  var dl=f.departureDelay,dep=f.departure||f.plannedDeparture,gone=new Date(dep).getTime()<now-60000;
  var mins=Math.round((new Date(z.arrival||z.plannedArrival)-new Date(a.departure||a.plannedDeparture))/60000);
  var lines=legs.map(function(l){var n=l.line&&(l.line.name||l.line.id)||'';return '<span class="line '+lineCls(n)+'">'+esc(n)+'</span>'}).join('');
  var s=f.cancelled?'<span class="late">fällt aus</span>':dl==null?'':dl>=60?'<span class="late">+'+Math.round(dl/60)+' min</span>':'<span class="ok">pünktlich</span>';
  var walk=a.walking&&a!==f?' · erst '+Math.round((new Date(a.arrival)-new Date(a.departure))/60000)+' min zu Fuß zu '+esc(f.origin&&f.origin.name):'';
  return '<div class="conn'+(gone?' gone':'')+'"><div class="ct"><b>'+hhmm(dep)+'</b>'+(dl>=60?'<s>'+hhmm(f.plannedDeparture)+'</s>':'')+'</div>'
    +'<div class="ci"><b>'+lines+' '+esc(f.direction||'')+'</b><span>'+s+(f.departurePlatform?' · Gleis '+esc(f.departurePlatform):'')+walk+' · an '+hhmm(z.arrival||z.plannedArrival)+' · '+mins+' min'+(legs.length>1?' · '+(legs.length-1)+'× umsteigen':'')+'</span></div></div>';
}
function depHtml(d,now){
  var dl=d.delay,t=d.when||d.plannedWhen,n=d.line&&d.line.name||'';
  var s=d.cancelled?'<span class="late">fällt aus</span>':dl==null?'':dl>=60?'<span class="late">+'+Math.round(dl/60)+' min</span>':'<span class="ok">pünktlich</span>';
  return '<div class="conn"><div class="ct"><b>'+hhmm(t)+'</b>'+(dl>=60?'<s>'+hhmm(d.plannedWhen)+'</s>':'')+'</div><div class="ci"><b><span class="line '+lineCls(n)+'">'+esc(n)+'</span> '+esc(d.direction)+'</b><span>'+s+(d.platform?' · Gleis '+esc(d.platform):'')+'</span></div></div>';
}
var busy=false;
function load(){
  if(busy)return;busy=true;var dir=st.dir||autoDir(),now=Date.now();
  document.querySelectorAll('[data-dir]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.dir===dir)});
  $('#route').textContent=dir==='hin'?CFG.home+' → Hochschule':'Hochschule → '+CFG.home;
  $('#upd').textContent='lädt …';
  if(!$('#conns').innerHTML)$('#conns').innerHTML='<p class="msg">Lade Verbindungen …</p>';
  station(CFG.home).then(function(h){
    var q=dir==='hin'?'from='+encodeURIComponent(h.id)+'&'+dest('to.'):dest('from.')+'&to='+encodeURIComponent(h.id);
    var jr=apiRetry('/journeys?'+q+'&results=5&stopovers=false&remarks=false&language=de');
    /* Abfahrtstafel: morgens Grafing, nachmittags Hackerbrücke */
    var bq=dir==='hin'?Promise.resolve(h):station('München Hackerbrücke');
    var br=bq.then(function(s){return apiRetry('/stops/'+encodeURIComponent(s.id)+'/departures?duration=60&results=8&language=de&remarks=false').then(function(r){return{s:s,d:r.departures||r}})});
    return Promise.all([jr,br.catch(function(e){return{err:e}})]);
  }).then(function(r){
    var js=r[0].journeys||[];
    $('#conns').innerHTML='<h2>Verbindungen</h2>'+(js.length?js.map(function(j){return journeyHtml(j,now)}).join(''):'<p class="msg">Keine Verbindungen gefunden.</p>');
    var b=r[1];
    if(b.err)$('#board').innerHTML='<h2>Abfahrten</h2><p class="msg">Abfahrtstafel gerade nicht erreichbar.</p>';
    else{
      var ds=(b.d||[]).filter(function(d){return dir==='rueck'?/grafing|ebersberg|kreuzstra/i.test(d.direction||''):/m(ü|ue)nchen|tutzing|geltendorf|pasing|ost|hbf|hauptbahnhof/i.test((d.direction||'')+' '+(d.line&&d.line.name||''))});
      $('#board').innerHTML='<h2>Abfahrten '+esc(b.s.name)+(dir==='rueck'?' Richtung Grafing':' Richtung München')+'</h2>'+(ds.length?ds.slice(0,6).map(function(d){return depHtml(d,now)}).join(''):'<p class="msg">In der nächsten Stunde keine passende Abfahrt.</p>');
    }
    $('#upd').textContent='live · '+hhmm(new Date().toISOString());
  }).catch(function(e){
    $('#upd').innerHTML='<span class="err">offline</span>';
    $('#conns').innerHTML='<h2>Verbindungen</h2><p class="msg err">Bahn-Server gerade nicht erreichbar ('+esc(e.name==='AbortError'?'Zeitüberschreitung':e.message)+'). Ich versuche es jede Minute neu.</p><p class="msg"><a href="https://www.bahnhof.de/'+(dir==='hin'?'grafing-bahnhof':'muenchen-hackerbruecke')+'/abfahrt" target="_blank" rel="noopener">Abfahrtstafel bei bahnhof.de öffnen</a></p>';
  }).then(function(){busy=false});
}
document.querySelectorAll('[data-dir]').forEach(function(b){b.onclick=function(){st.dir=b.dataset.dir;$('#conns').innerHTML='';$('#board').innerHTML='';load()}});
$('#refresh').onclick=load;
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
setInterval(function(){if(!document.hidden)load()},60000);
load();
</script>
</body>
</html>
