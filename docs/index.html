  });
  tool('log_time','Trägt gelernte Zeit ein.',{moduleId:{type:'string'},minutes:{type:'number'},date:{type:'string'}},['moduleId','minutes'],function(i){
    var m=needMod(i.moduleId);note(i.minutes+' min für '+(m.short||m.name)+' eingetragen');
    return S.db.collection('logs').add({moduleId:m.id,minutes:+i.minutes,date:String(i.date||today()),created:Date.now(),source:'chat'}).then(function(){return 'ok'});
  });
  return T;
}
function askFor(kind){
  var m=S.modules[S.mod];if(!m)return;var n=m.short||m.name;
  var q={path:'Erstelle den Lernpfad für '+n+' neu aus dem hochgeladenen Material. Lies dazu die wichtigsten PDFs, ordne jedem Schritt die passenden Dateien zu und behalte erledigte Schritte.',
    cards:'Erstelle 15 Karteikarten für '+n+' aus dem wichtigsten Material (Skript zuerst).',
    summary:'Schreib eine klausurorientierte Zusammenfassung für '+n+' aus dem Material.',
    quiz:'Erstelle 10 Probefragen mit Lösungen im Stil der Altklausuren für '+n+'.'}[kind];
  openChat(q,true);
}

/* ---------- Kalender-Export ---------- */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function buildIcs(opts){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lernplan WS2627//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Lernplan',
    'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
  var now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),n=0;
  function ev(uidv,d,s,e,sum,desc){L.push('BEGIN:VEVENT','UID:'+uidv+'@lernplan-ws2627','DTSTAMP:'+now,'DTSTART;TZID=Europe/Berlin:'+d.replace(/-/g,'')+'T'+s.replace(':','')+'00','DTEND;TZID=Europe/Berlin:'+d.replace(/-/g,'')+'T'+e.replace(':','')+'00','SUMMARY:'+icsEsc(sum));if(desc)L.push('DESCRIPTION:'+icsEsc(desc));L.push('END:VEVENT');n++}
  var from=mondayOf(today()),to=sem().examEnd;
  for(var d=from;d<=to;d=addDays(d,1)){
    if(opts.lect)lecturesOn(d).forEach(function(b){var m=modOf(b.moduleId);ev('L-'+b.id+'-'+d,d,b.start,b.end,m.name+' ('+(KIND[b.kind]||'')+')')});
    if(opts.study)studyOn(d).forEach(function(b){var m=modOf(b.moduleId);ev('S-'+b.id,d,b.start,b.end,'Lernen: '+m.name,'Lernblock aus dem Lernplan')});
  }
  if(opts.dates){
    var all=[];mods().forEach(function(m){(m.dates||[]).forEach(function(x){if(x.date)all.push({d:x.date,l:(m.short||m.name)+': '+x.label,t:x.time})})});
    (S.settings.events||[]).forEach(function(e){all.push({d:e.date,l:e.label})});
    all.filter(function(x){return x.d>=from}).forEach(function(x,i){
      if(x.t)ev('D-'+i+'-'+x.d,x.d,x.t,hmStr(hm(x.t)+60),x.l);
      else{L.push('BEGIN:VEVENT','UID:D-'+x.d+'-'+i+'@lernplan-ws2627','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+x.d.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(x.d,1).replace(/-/g,''),'SUMMARY:'+icsEsc(x.l),'END:VEVENT');n++}
    });
  }
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n')+'\r\n',count:n};
}
function openIcs(){
  openSheet('<h2>Kalender-Export</h2><p class="small muted" style="margin:0">Erstellt eine .ics-Datei ab dieser Woche bis '+fmtDate(sem().examEnd)+'. Auf dem iPhone die Datei öffnen und „Alle hinzufügen“ wählen, am besten in einen eigenen Kalender „Lernplan“. Nach Änderungen einfach neu exportieren und den alten Kalender vorher leeren.</p>'
    +'<label><input type="checkbox" id="icsL" checked> Vorlesungen und Praktika</label><label><input type="checkbox" id="icsS" checked> Lernblöcke</label><label><input type="checkbox" id="icsD" checked> Termine und Fristen</label>'
    +(S.downloads?'':'<p class="small muted">Speichern ist in dieser Ansicht nicht verfügbar.</p>')
    +'<div class="frow" style="justify-content:flex-end"><button class="btn ghost" data-sheet="close">Abbrechen</button><button class="btn" data-sheet="ics"'+(S.downloads?'':' disabled')+'>Datei speichern</button></div>');
}
function doIcs(){
  var r=buildIcs({lect:$('icsL').checked,study:$('icsS').checked,dates:$('icsD').checked});closeSheet();
  S.downloads.save({filename:'Mein-Plan.ics',data:new Blob([r.text],{type:'text/calendar'})}).then(function(){toast(r.count+' Termine exportiert.')}).catch(function(e){if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('Export hat nicht geklappt.')});
}

/* ---------- Ereignisse ---------- */
function addLog(modId,min,date,source){
  if(!S.db||!modId||!(min>0))return;
  S.db.collection('logs').add({moduleId:modId,minutes:min,date:date||today(),created:Date.now(),source:source||'manual'}).then(function(){toast(fmtMin(min)+' für '+(modOf(modId).short||'')+' eingetragen, +'+Math.floor(min/10)+' XP.')}).catch(saveErr);
}
document.addEventListener('click',function(e){
  var bs=e.target.closest('.blk.study');if(bs){if(e.detail===0)openBlock(bs.dataset.bid);return}
  var t=e.target.closest(ACT);if(t)act(t,e.target,e);
});
function act(t,target,e){
  var d=t.dataset;
  if(t.classList.contains('col')){if(target.closest('.blk'))return;
    var r=t.getBoundingClientRect(),mins=START*60+Math.floor((e.clientY-r.top)/HPX*4)*15;openNewBlock(t.dataset.date,hmStr(mins));return;
  }
  if(d.asset!=null){if(e.cancelable)e.preventDefault();openAsset(d.asset,t.textContent);return}
  if(d.tab){S.tab=d.tab;store('lp_tab',d.tab);render()}
  else if(d.tblk){openBlock(d.tblk)}
  else if(d.trdir){TR.dir=d.trdir;trLoad(d.trdir,false);render();var tp=document.querySelector('.train');if(tp&&tp.scrollIntoView&&!t.closest('.train'))tp.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(d.trrefresh){var dd=trDir();TR.at[dd]=0;trLoad(dd,true);render()}
  else if(d.trset){openCommuteSettings()}
  else if(d.quickdone){toggleDone(d.quickdone)}
  else if(d.newproj){openNewProject()}
  else if(d.parea){S.parea=d.parea;render()}
  else if(d.archive){if(d.confirm!=='1'){t.dataset.confirm='1';t.textContent='Wirklich ausblenden?';return}var am=S.mod;closeModule();upd('modules/'+am,{archived:true});toast('Projekt ausgeblendet.')}
  else if(d.day!=null){S.day=+d.day;render()}
  else if(d.wk!=null){var n=+d.wk;S.week=n===0?mondayOf(today()):addDays(S.week,7*n);if(n===0){S.day=wday(today())}else S.swipeDir=n;render()}
  else if(d.open){if(e.cancelable)e.preventDefault();openModule(d.open)}
  else if(d.closemod){closeModule()}
  else if(d.askmod){openChat('',false)}
  else if(d.ask){askFor(d.ask)}
  else if(d.closeviewer){$('viewer').hidden=true;$('viewer').innerHTML=''}
  else if(d.newblock){openNewBlock(d.newblock==='today'?today():undefined)}
  else if(d.ics){openIcs()}
  else if(d.acct){window.PLAN&&PLAN.account()}
  else if(d.rate){var rp=d.rate.split('|');t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===t)});t.parentNode.dataset.val=rp[1]}
  else if(d.coach){coachAction(d.coach,t)}
  else if(d.sheet){if(d.sheet==='ics')doIcs();else sheetAction(d.sheet,t)}
  else if(d.chat){if(d.chat==='close')$('chat').hidden=true;else if(d.chat==='new'){S.chat=[];S.chatLog=[];renderChat(true)}else if(d.chat==='stop'&&S.ctl)S.ctl.abort()}
  else if(d.sug){$('chatbox').value=d.sug;sendChat()}
  else if(d.deltopic!=null){var m=S.modules[S.mod],p=(m.path||[]).slice();p.splice(+d.deltopic,1);upd('modules/'+S.mod,{path:p})}
  else if(d.deltool!=null){if(d.confirm!=='1'){t.dataset.confirm='1';t.textContent='Löschen?';return}var mt=S.modules[S.mod],tl=(mt.tools||[]).slice();tl.splice(+d.deltool,1);upd('modules/'+S.mod,{tools:tl})}
  else if(d.flip){var f=S.flip[d.flip]||{i:0,show:false};f.show=!f.show;S.flip[d.flip]=f;renderModPanel()}
  else if(d.card){var f2=S.flip[d.card]||{i:0,show:false},n2=+d.n;f2.i=(f2.i+ +d.step+n2)%n2;f2.show=false;S.flip[d.card]=f2;renderModPanel()}
  else if(d.timer==='start'){var sel=d.mod||($('tmod')&&$('tmod').value);if(!sel)return;S.timer={t:Date.now(),mod:sel};store('lp_timer',JSON.stringify(S.timer));render()}
  else if(d.timer==='stop'){var run=S.timer;if(!run)return;var mins=Math.max(1,Math.round((Date.now()-run.t)/60000));S.timer=null;store('lp_timer',null);addLog(run.mod,mins,today(),'timer');render()}
  else if(d.delmat!=null){if(d.confirm!=='1'){t.dataset.confirm='1';t.textContent='Wirklich löschen?';return}removeMaterial(S.mod,+d.delmat)}
  else if(d.dellog){S.db.doc('logs/'+d.dellog).delete().catch(saveErr)}
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('viewer').hidden){$('viewer').hidden=true;$('viewer').innerHTML=''}else if(!$('sheet').hidden)closeSheet();else if(!$('chat').hidden)$('chat').hidden=true;else if(S.mod)closeModule()}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('blk')&&e.target.classList.contains('study'))openBlock(e.target.dataset.bid);
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatbox'){e.preventDefault();sendChat()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.topic!=null&&S.mod){var m=S.modules[S.mod],p=clone(m.path||[]);p[+t.dataset.topic].done=t.checked;if(t.checked)p[+t.dataset.topic].doneAt=today();upd('modules/'+S.mod,{path:p});if(t.checked)toast('Geschafft! +25 XP')}
  if(t.dataset&&t.dataset.ms){var mp=t.dataset.ms.split('|'),mm=S.modules[mp[0]];if(mm){var pp=clone(mm.path||[]);if(pp[+mp[1]]){pp[+mp[1]].done=t.checked;if(t.checked)pp[+mp[1]].doneAt=today();upd('modules/'+mp[0],{path:pp});if(t.checked)toast('Meilenstein geschafft! +25 XP')}}}
  if(t.dataset&&t.dataset.plan){var v=t.value.trim(),o={};o[t.dataset.f]=v===''?null:+v.replace(',','.');upd('modules/'+t.dataset.plan,o)}
  if(t.id==='upfile'&&t.files&&t.files[0])doUpload(t.files[0]);
  if(t.id==='fmod')S.form.mod=t.value;
  if(t.id==='fdate')S.form.date=t.value;
});
document.addEventListener('input',function(e){if(e.target.id==='fmin')S.form.min=e.target.value});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.dataset.newtopic){var v=$('newTopic').value.trim();if(!v||!S.mod)return;var m=S.modules[S.mod],p=(m.path||[]).slice();p.push({t:v,done:false,refs:[]});upd('modules/'+S.mod,{path:p})}
  else if(f.dataset.log==='mod'){addLog(S.mod,+$('mmin').value,$('mdate').value||today(),'manual')}
  else if(f.dataset.log){var mid=$('fmod').value;S.form.mod=mid;addLog(mid,+$('fmin').value,$('fdate').value||today(),'manual')}
  else if(f.dataset.chatform){sendChat()}
  else if(f.dataset.projedit&&S.mod){var pe=readProj();if(!pe.name)return;upd('modules/'+S.mod,pe);toast('Gespeichert.')}
});
$('fab').addEventListener('click',function(){openChat('',false)});
setInterval(function(){if(!S.timer)return;var s=clock(Math.floor((Date.now()-S.timer.t)/1000));Array.prototype.forEach.call(document.querySelectorAll('.tclock'),function(c){c.textContent=s})},1000);

/* ---------- Start ---------- */
try{var tm=store('lp_timer');if(tm)S.timer=JSON.parse(tm)}catch(e){}
/* Querformat (iPad/PC): Kopf in einer Zeile, Wochenplan passt in die Bildschirmhöhe, Termine rechts daneben */
function applyLayout(){
  var w=window.innerWidth,h=window.innerHeight,land=w>=900&&w>h&&h>=500,old=HPX;
  document.documentElement.classList.toggle('land',land);
  HPX=land?Math.max(30,Math.min(60,Math.floor((h-380)/(END-START)))):44;
  return old!==HPX;
}
var layoutT=null;
window.addEventListener('resize',function(){clearTimeout(layoutT);layoutT=setTimeout(function(){applyLayout();if(S.loaded)render()},150)});
applyLayout();
S.week=mondayOf(today());S.day=wday(today());
render();
function sub(name,cb){
  S.db.collection(name).onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=clone(d.data())});S[name]=o;cb&&cb();render()},
    function(err){console.error(name,err);cb&&cb();render()});
}
function init(db){
  S.db=db;var need={modules:1,blocks:1,study:1,logs:1,settings:1};
  function done(k){delete need[k];if(!Object.keys(need).length){S.loaded=true;if(!/^(today|coach|week|modules|projects|tracker)$/.test(S.tab))S.tab='today';if(!S.form.mod&&mods()[0])S.form.mod=mods()[0].id}}
  sub('modules',function(){done('modules')});sub('blocks',function(){done('blocks')});sub('study',function(){done('study')});sub('logs',function(){done('logs')});sub('coach');sub('checkins');sub('notes');
  db.doc('settings/main').onSnapshot(function(s){if(s.exists)S.settings=Object.assign({weeklyTarget:14,events:[]},clone(s.data()));done('settings');render()},function(){done('settings');render()});
}
if(window.claude&&claude.use){
  claude.use('db').then(function(db){if(!db){S.loaded=true;$('main').innerHTML='<div class="empty">Der Speicher ist gerade nicht erreichbar. Lade die Seite neu.</div>';return}init(db)});
  claude.use('assets').then(function(a){if(a){S.assets=a;render()}});
  claude.use('sample').then(function(s){if(s){S.sample=s;$('fab').hidden=false;render()}});
  claude.use('downloads').then(function(d){if(d)S.downloads=d});
}else{S.loaded=true;$('main').innerHTML='<div class="empty">Der Speicher ist in dieser Ansicht nicht verfügbar.</div>'}
})();
</script>
