<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Plan</title>
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mein Plan">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
[hidden]{display:none!important}
/* Design: Redesign aus Claude Design (hell, ruhig, weiche Ecken, Systemschrift, eine Akzentfarbe, Modulfarben als zarte Flächen).
   Ebenen: Modulseite, Lernblock-Editor (Sheet von unten), Datei-Viewer, Chat (Panel rechts / Vollbild auf dem Handy). */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --group:#F2F2F7; --surface2:#F2F2F7; --line:#E5E5EA; --line2:#EFEFF2;
  --fg:#1D1D1F; --muted:#6E6E73; --faint:#8E8E93; --accent:#0066CC; --accent-fg:#FFFFFF; --accent-soft:#E6EFFA; --accent-ink:#0058B0;
  --hours:#0B7A70; --hours-soft:#E2F3F0; --ok:#1E8E4E; --warn:#B45309; --danger:#D70015; --danger-soft:#FFE9E9; --danger-ink:#9F0010;
  --note:#FFF1E0; --note-ink:#8A4B00; --info:#EEF5FF; --info-ink:#0B3D73; --ink:#1D1D1F; --ink-fg:#FFFFFF;
  --mod-bg-l:91%; --mod-bg-s:70%; --mod-fg-l:24%; --mod-fg-s:50%; --mod-line-l:86%; --study-bg-l:98%; --study-line-l:52%;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04); --shade:rgba(0,0,0,.32);
  --r-field:8px; --r-block:12px; --r-btn:14px; --r-card:22px; --r-sheet:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --group:#2C2C2E; --surface2:#2C2C2E; --line:#38383A; --line2:#2C2C2E;
  --fg:#F5F5F7; --muted:#A1A1A6; --faint:#8E8E93; --accent:#4DA3FF; --accent-fg:#001A33; --accent-soft:#0F2A47; --accent-ink:#9CCBFF;
  --hours:#40C8B8; --hours-soft:#0E3330; --ok:#32D74B; --warn:#FFB340; --danger:#FF6961; --danger-soft:#3A1416; --danger-ink:#FFB4B0;
  --note:#3A2A12; --note-ink:#FFD08A; --info:#0F2A47; --info-ink:#B9DBFF; --ink:#F5F5F7; --ink-fg:#000000;
  --mod-bg-l:22%; --mod-bg-s:35%; --mod-fg-l:85%; --mod-fg-s:70%; --mod-line-l:30%; --study-bg-l:13%; --study-line-l:55%;
  --shadow:none; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --group:#2C2C2E; --surface2:#2C2C2E; --line:#38383A; --line2:#2C2C2E;
  --fg:#F5F5F7; --muted:#A1A1A6; --faint:#8E8E93; --accent:#4DA3FF; --accent-fg:#001A33; --accent-soft:#0F2A47; --accent-ink:#9CCBFF;
  --hours:#40C8B8; --hours-soft:#0E3330; --ok:#32D74B; --warn:#FFB340; --danger:#FF6961; --danger-soft:#3A1416; --danger-ink:#FFB4B0;
  --note:#3A2A12; --note-ink:#FFD08A; --info:#0F2A47; --info-ink:#B9DBFF; --ink:#F5F5F7; --ink-fg:#000000;
  --mod-bg-l:22%; --mod-bg-s:35%; --mod-fg-l:85%; --mod-fg-s:70%; --mod-line-l:30%; --study-bg-l:13%; --study-line-l:55%;
  --shadow:none; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:24px 16px 120px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Kopf */
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hd-sub{font-size:15px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.overall{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%;order:3}
.ring{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.ring svg{flex:none}
.ring .rt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ring .rl{font-size:13px;color:var(--muted);font-weight:500}
.ring .rv{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.ring .rv small{font-size:17px;font-weight:500;color:var(--muted)}
.ring .rs{font-size:13px;color:var(--muted)}
.meter{min-width:0}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.meter .row b,.meter .row>span:last-child{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--accent-soft);border-radius:999px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.h{background:var(--hours-soft)}
.bar.h>i{background:var(--hours)}
.bar.ok>i{background:var(--ok)}

/* Bereiche: Segmente (Desktop), Tab-Leiste unten (Handy) */
nav.tabs{display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--group);align-self:flex-start;order:2}
nav.tabs button{display:flex;align-items:center;gap:6px;height:38px;padding:0 20px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--fg)}
nav.tabs button svg{display:none}
nav.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.panel{background:var(--surface);border-radius:var(--r-card);padding:22px;min-width:0;box-shadow:var(--shadow)}
.panel>h3:first-child{margin-bottom:2px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Knöpfe & Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--accent);color:var(--accent-fg);border:0;padding:0 18px;border-radius:var(--r-btn);font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--group);color:var(--fg)}
.btn.tint{background:var(--accent-soft);color:var(--accent-ink)}
.btn.okb{background:var(--ok);color:#fff}
.btn.danger{background:var(--group);color:var(--danger)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:999px}
.btn:disabled{opacity:.5;cursor:default}
.x{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;background:none;border:0;color:var(--faint);border-radius:999px;font-size:15px}
.x:hover{color:var(--danger)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{min-height:44px;padding:0 12px;background:var(--group);border:0;border-radius:12px;min-width:0;font-size:15px;color:var(--fg)}
textarea{padding:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.field>input,.field>select{color:var(--fg);font-size:15px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.frow>.field{flex:1 1 120px}
form.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
form.inline input,form.inline select{flex:1 1 140px}
.empty{color:var(--muted);font-size:14px;background:var(--bg);border-radius:18px;padding:20px 16px;text-align:center}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--group);color:var(--muted);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Laden: Skeleton */
.skel{display:grid;gap:16px}
.skel i{display:block;height:96px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--surface) 0,var(--group) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
.skel i.tall{height:420px}
.skel span{color:var(--muted);font-size:14px;text-align:center}
@keyframes sk{to{background-position:-200% 0}}

/* Woche */
.weekbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.weekbar .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--group);color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.weekbar .lbl{display:flex;flex-direction:column;padding:0 6px;min-width:150px}
.weekbar .lbl b{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.weekbar .lbl span{font-size:14px;color:var(--muted)}
.btn.today{background:var(--group);color:var(--fg);border-radius:999px;padding:0 16px;font-size:14px}
.banner{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:12px 14px;border-radius:14px;background:var(--info);color:var(--info-ink);margin-bottom:12px}
.banner.exam{background:var(--note);color:var(--note-ink)}
.banner b{font-weight:700}
.daytabs{display:none;gap:4px;margin-bottom:12px;position:relative}
.daytabs button{flex:1;height:56px;border:0;background:var(--group);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg);transition:background .22s,color .22s}
.daytabs button small{font-size:17px;font-weight:600;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.daytabs button.td{color:var(--accent)}
.daytabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.weekwrap{overflow:hidden}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:0;touch-action:pan-y}
.week.slide-l{animation:slL .22s ease-out}
.week.slide-r{animation:slR .22s ease-out}
@keyframes slL{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 2px 10px;min-width:0}
.dh b{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.dh span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.dh.today b{color:var(--accent)}
.dh.today span{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-direction:column;gap:3px;width:100%;align-items:center;order:-1}
.ev{font-size:11px;font-weight:600;line-height:1.2;padding:3px 8px;border-radius:999px;background:var(--note);color:var(--note-ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0}
.gutter{position:relative}
.gutter span{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.col{position:relative;background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% var(--hpx);border-left:1px solid var(--line2);cursor:copy}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.col.off{background-color:color-mix(in srgb,var(--muted) 5%,transparent)}
.blk{position:absolute;overflow:hidden;text-align:left;border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.25;--h:210;cursor:pointer;display:flex;flex-direction:column;gap:1px;
  background:hsl(var(--h) var(--mod-bg-s) var(--mod-bg-l));color:hsl(var(--h) var(--mod-fg-s) var(--mod-fg-l));border:1px solid hsl(var(--h) 60% var(--mod-line-l));margin:0 2px;transition:transform .15s,box-shadow .15s}
.blk.study{background:hsl(var(--h) var(--mod-bg-s) var(--study-bg-l));border:1.5px dashed hsl(var(--h) 45% var(--study-line-l));touch-action:manipulation;-webkit-touch-callout:none;cursor:grab;user-select:none;-webkit-user-select:none}
.blk.study.done{border-style:solid}
.blk.nomod{--h:0;background:var(--surface);border-color:var(--faint);color:var(--muted)}
.blk.lift{border:2px solid var(--accent);transform:scale(1.03);box-shadow:0 14px 30px rgba(0,102,204,.22);z-index:4}
.blk.dragging{z-index:5;border:2px solid var(--accent);background:var(--surface);transform:scale(1.03);box-shadow:0 14px 30px rgba(0,102,204,.22);cursor:grabbing;transition:none}
.blk b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.blk .t{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.blk .mark{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;background:var(--warn)}
.blk .mark.ok{background:var(--ok)}
.blk .mark svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.gomod{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:12px 16px;border:0;border-radius:16px;text-align:left;--h:210;background:hsl(var(--h) var(--mod-bg-s) var(--mod-bg-l));color:hsl(var(--h) var(--mod-fg-s) calc(var(--mod-fg-l) - 2%))}
.gomod span{display:flex;flex-direction:column;gap:2px}
.gomod small{font-size:12px;font-weight:600;opacity:.8}
.gomod strong{font-size:17px;font-weight:600}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:hsl(210 70% var(--mod-bg-l))}
.legend i.s{background:transparent;border:1.5px dashed hsl(210 45% var(--study-line-l))}
.weekhint{flex-basis:100%;font-size:12px}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.deadline{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid var(--line2);font-size:15px}
.deadline:last-child{border:0}
.deadline .when{font-size:13px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.deadline .when.soon{color:var(--note-ink);background:var(--note);padding:3px 9px;border-radius:999px;font-weight:600}
@media (max-width:720px){
  .daytabs{display:flex}
  .week{grid-template-columns:48px minmax(0,1fr)}
  .week .dh,.week>div:first-child{display:none}
  .col:not(.sel){display:none}
  .blk{padding:8px 10px;border-radius:12px}
  .blk b{font-size:14px}
  .blk .t{font-size:12px}
  .blk .mark{width:22px;height:22px;top:8px;right:8px}
}

/* Module */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mcard{text-align:left;background:var(--surface);border:0;border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:16px;--h:210;min-width:0;box-shadow:var(--shadow);color:var(--fg);transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mhead{display:flex;align-items:flex-start;gap:14px;min-width:0}
.code{flex:none;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.02em;background:hsl(var(--h) var(--mod-bg-s) var(--mod-bg-l));color:hsl(var(--h) var(--mod-fg-s) var(--mod-fg-l))}
.code.big{width:56px;height:56px;border-radius:16px;font-size:18px}
.mcard .nm{font-size:17px;font-weight:600;line-height:1.25}
.mcard .meta{display:flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--muted)}
.mcard .bars{display:flex;flex-direction:column;gap:10px}
.mcard .meter .row{font-size:13px}
.mcard .meter .row>span:first-child{color:var(--muted)}
.mcard .bar{height:6px;margin-top:5px}
.check{display:flex;gap:4px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line2)}
.check:last-child{border:0}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:10px;border-radius:50%;border:2px solid var(--faint);background:transparent;display:grid;place-content:center;cursor:pointer}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check .tt{font-size:16px;line-height:1.3;display:block;padding-top:11px;cursor:pointer}
.check.done .tt{color:var(--muted);text-decoration:line-through}
.check .body{flex:1;min-width:0;padding-bottom:6px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ref{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--group);color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.ref.pc{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat{background:var(--surface);border-radius:var(--r-card);padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column-reverse;gap:4px}
.stat b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
.days{display:flex;align-items:flex-end;gap:14px;height:200px;margin-top:16px}
.days>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;min-width:0}
.days i{display:block;width:100%;max-width:44px;background:var(--hours);border-radius:10px;min-height:4px}
.days small{font-size:12px;color:var(--muted)}
.days .v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.timer .clock{font-size:34px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.timer [data-timer="stop"]{background:#FFE5E5;color:var(--danger);border-radius:999px}
:root[data-theme="dark"] .timer [data-timer="stop"]{background:var(--danger-soft)}
@media (prefers-color-scheme:dark){.timer [data-timer="stop"]{background:var(--danger-soft)}}
.card3d{border:0;border-radius:16px;padding:22px;min-height:168px;width:100%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--accent-soft);color:var(--fg)}
.card3d small{color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:600}
.card3d span{font-size:18px;font-weight:600;line-height:1.35}
.summary{white-space:pre-wrap}
.tool{border-top:1px solid var(--line2);padding-top:14px;margin-top:14px}
.logrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line2);min-height:52px;font-size:15px}
.logrow:last-child{border:0}
.logrow .grow{flex:1;min-width:0}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}
.plan{width:100%;border-collapse:collapse;font-size:15px}
.plan th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.plan td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle;min-height:54px}
.plan input{width:80px;min-height:36px;border-radius:10px;text-align:center;padding:0 6px}
.scrollx{overflow-x:auto}

/* Ebenen */
.layer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.layer .lbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line2)}
.layer .ltitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:17px}
.layer .lbody{flex:1;overflow:auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));min-height:0;-webkit-overflow-scrolling:touch}
.layer .lin{max-width:1080px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;border:0;background:none;color:var(--accent);font-size:17px}
.askbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-size:14px;font-weight:600}
.mtitle{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.mtitle h1{font-size:30px;line-height:1.15}
#modpanel{z-index:40}
#sheet{z-index:50;background:var(--shade);align-items:center;justify-content:center;padding:16px}
#sheet .card{background:var(--group);border-radius:var(--r-sheet);padding:22px 18px;width:100%;max-width:460px;max-height:calc(100% - 16px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:pop .2s ease-out}
#sheet .card h2{font-size:17px;font-weight:600;text-align:center}
#sheet .card .field{background:var(--surface);border-radius:14px;padding:10px 14px}
#sheet .card .field>input,#sheet .card .field>select{background:var(--group)}
#sheet .card .frow{gap:8px}
#sheet .card .btn{min-height:50px;font-size:16px}
#sheet .card [data-sheet="done"]{background:var(--ok);color:#fff;flex:1}
#sheet .card [data-sheet="done"].ghost{background:var(--surface);color:var(--fg)}
#sheet .card [data-sheet="del"]{background:var(--surface);color:var(--danger)}
#sheet .card label.chk{display:flex;align-items:center;gap:12px;min-height:48px;background:var(--surface);border-radius:14px;padding:0 14px;font-size:16px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:720px){
  #sheet{justify-content:flex-end;align-items:stretch;padding:0}
  #sheet .card{max-width:none;border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:calc(100% - 60px);padding:10px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .24s ease-out}
  #sheet .card::before{content:"";align-self:center;width:38px;height:5px;border-radius:999px;background:var(--faint);opacity:.5;flex:none}
  #modpanel,#viewer{animation:up .24s ease-out}
}
#chat{z-index:55;left:auto;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.06)}
#chat .lbar{background:var(--surface)}
#viewer{z-index:60}
.vpage{max-width:900px;margin:0 auto 12px;background:#fff;border-radius:8px;box-shadow:var(--shadow)}
.fab{position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 22px;border:0;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.user{background:var(--accent);color:var(--accent-fg);align-self:flex-end;max-width:85%}
.msg.assistant{background:var(--group);align-self:flex-start;max-width:95%}
.msg.tool{font-size:12px;color:var(--muted);padding:0 6px}
.chatin{display:flex;gap:8px;align-items:flex-end;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--surface)}
.chatin textarea{flex:1;resize:none;min-height:44px;height:44px;max-height:120px;border-radius:22px;padding:11px 16px}
.chatin .btn{border-radius:999px}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sugs button{min-height:44px;font-size:14px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.timerchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);font-size:14px;color:var(--fg)}
.timerchip::before{content:"";width:8px;height:8px;border-radius:50%;background:#E5484D}
.timerchip b{font-weight:600}
.timerchip .tclock{color:var(--muted);font-variant-numeric:tabular-nums}
.fab{transition:visibility 0s .45s}
body:has(.layer:not([hidden])) .fab{visibility:hidden;transition:none}
/* Querformat auf iPad und PC */
.wkside{margin-top:16px}
html.land body{padding:20px 28px 28px}
html.land .wrap{max-width:1640px;gap:16px}
html.land header.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px}
html.land h1{font-size:30px}
html.land .hd-sub{font-size:13px}
html.land .overall{order:1;width:auto;grid-template-columns:repeat(2,minmax(0,300px));justify-content:center;gap:12px}

html.land .wkside .panel{padding:18px}
html.land nav.tabs{order:2;align-self:center}

html.land .wkl>.panel{padding:16px 18px}

html.land .dh{padding:4px 2px 6px;gap:4px}

html.land .legend{margin-top:10px}

/* Lifestyle: Heute, Projekte, Level */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.hero .hello{background:var(--surface);border-radius:var(--r-card);padding:18px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.hero .hello b{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero .hello span{color:var(--muted);font-size:14px}
.pill{background:var(--surface);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.pill .pl{font-size:13px;color:var(--muted);font-weight:500;display:flex;flex-wrap:wrap;gap:0 4px}
.pill .pv{color:var(--fg);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pill .pv small{font-size:15px;font-weight:500;color:var(--muted)}
.pill .ps{font-size:12px;color:var(--muted)}
.pill.lv .bar{background:var(--accent-soft)}
.pill.fire .pv{color:var(--warn)}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.titem{display:flex;align-items:stretch;gap:0;border-radius:16px;background:hsl(var(--h) var(--mod-bg-s) var(--study-bg-l));border:1.5px solid hsl(var(--h) var(--mod-bg-s) var(--mod-line-l));min-height:60px;overflow:hidden}
.titem.lec{background:hsl(var(--h) var(--mod-bg-s) var(--mod-bg-l));border-color:transparent}
.titem.past{opacity:.55}
.titem.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.titem .tmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:10px 14px;border:0;background:none;text-align:left;color:hsl(var(--h) var(--mod-fg-s) var(--mod-fg-l))}
.titem .tt{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;min-width:46px;display:flex;flex-direction:column;line-height:1.25}
.titem .tt small{font-weight:400;opacity:.75}
.titem .tn{display:flex;flex-direction:column;min-width:0}
.titem .tn b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .tn span{font-size:12px;opacity:.8}
.titem .tq{flex:none;border:0;border-left:1px solid hsl(var(--h) var(--mod-bg-s) var(--mod-line-l));background:transparent;padding:0 14px;font-size:13px;font-weight:600;color:var(--accent);min-width:92px}
.titem .tq.done{color:var(--ok)}
.nowtag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-left:6px}
.goal{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line2)}
.goal:last-child{border:0}
.goal .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.goal .row b{font-weight:600}
.goal .row span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal .bar{height:6px;margin-top:2px}
.goal .bar>i{background:hsl(var(--h) 55% 50%)}
.goal .bar{background:hsl(var(--h) var(--mod-bg-s) var(--mod-bg-l))}
.nstep{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.nstep:last-child{border:0}
.nstep .code{width:40px;height:40px;font-size:12px;border-radius:12px}
.nstep .nb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nstep .nb b{font-size:15px;font-weight:600}
.nstep .nb label{font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.nstep .nb label input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.nstep .nb .muted{font-size:12px}
.nudge{background:var(--note);color:var(--note-ink);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nudge p{margin:0;font-size:14px;flex:1 1 200px}
.nudge .btn{background:var(--note-ink);color:var(--note)}
.areabar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.areabar button{border:0;border-radius:999px;padding:0 14px;height:36px;background:var(--group);font-size:14px;font-weight:500}
.areabar button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.atag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:hsl(var(--ah) 60% 92%);color:hsl(var(--ah) 50% 28%);align-self:flex-start}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .atag{background:hsl(var(--ah) 30% 22%);color:hsl(var(--ah) 70% 82%)}}
.mcard .next{font-size:13px;color:var(--muted);display:flex;gap:6px}
.mcard .next b{color:var(--fg);font-weight:500}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;width:0;height:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 60% 70%);border:3px solid transparent}
.swatches input:checked+span{border-color:var(--fg)}
#sheet .card textarea{width:100%;min-height:90px;border:0;border-radius:var(--r-field);background:var(--group);padding:10px 12px;color:var(--fg);font-size:15px;resize:vertical}
.pset .frow{margin-top:10px}
.lvtitle{font-size:12px;color:var(--accent);font-weight:600}
@media (max-width:900px){.hero{grid-template-columns:repeat(3,minmax(0,1fr))}.hero .hello{grid-column:1/-1}}
@media (max-width:720px){
  .hero{gap:8px}
  .pill{padding:12px;border-radius:16px}
  .pill .pv{font-size:20px}
  .pill .ps{display:none}
  .titem .tq{min-width:76px;padding:0 10px}
}
/* Fahrt zur Hochschule */
.blk.commute{background:repeating-linear-gradient(135deg,var(--group) 0 6px,transparent 6px 12px);border:1px solid var(--line);color:var(--muted)}
.blk.commute b{color:var(--muted);font-weight:600}
.titem.commute{--h:0;background:repeating-linear-gradient(135deg,var(--group) 0 6px,var(--surface) 6px 12px);border:1px solid var(--line)}
.titem.commute .tmain{color:var(--fg)}
.titem.commute .tq{color:var(--accent);border-left-color:var(--line)}
.train .dirs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--group);margin-top:12px}
.train .dirs button{flex:1;border:0;border-radius:9px;background:transparent;height:36px;font-size:14px;font-weight:500}
.train .dirs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.conn{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.conn:last-child{border:0}
.conn .ct{display:flex;flex-direction:column;min-width:64px;font-variant-numeric:tabular-nums}
.conn .ct b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.conn .ct s{font-size:12px;color:var(--muted)}
.conn .ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.conn .ci b{color:var(--fg);font-weight:600;font-size:14px}
.line{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:#2E8B3C;color:#fff;margin-right:4px}
.line.u{background:#0065AE}.line.t{background:#D82020}.line.b{background:#00586A}.line.r{background:#6E6E73}
.late{color:var(--danger);font-weight:600}
.ontime{color:var(--ok);font-weight:600}
.conn.gone{opacity:.5}
.tlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tlinks a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--group);color:var(--fg);font-size:14px;font-weight:500}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.livebadge i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.livebadge.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:up .2s ease-out}
#toast.err{background:var(--danger-soft);color:var(--danger-ink)}

</div>
<button class="btn fab" id="fab" hidden aria-label="Claude fragen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Claude fragen</span></button>
<div id="toast" role="status" aria-live="polite" hidden></div>

<div class="layer" id="sheet" hidden></div>
<div class="layer" id="viewer" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
(function(){
var START=7, END=21, HPX=44;
var DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
var KIND={lecture:'Vorlesung',practical:'Praktikum',study:'Lernblock'};
var MTYPES=['Upload','Skript','Übung','Altklausur','Lösung','Praktikum','Projekt','Sonstiges'];
var S={modules:{},blocks:{},study:{},logs:{},coach:{},checkins:{},notes:{},settings:{weeklyTarget:14,events:[]},loaded:false,tab:(store('lp_tab')||'today'),parea:'all',mod:null,
  week:null,day:0,db:null,assets:null,sample:null,downloads:null,form:{mod:'',min:'60',date:''},flip:{},timer:null,upMsg:'',
  chat:[],chatLog:[],busy:false,dragging:false,pendingRender:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function parseYmd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function mondayOf(s){var d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function wday(s){return (parseYmd(s).getDay()+6)%7}
function fmtDate(s){if(!s)return '';var d=parseYmd(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()}
function fmtShort(s){var d=parseYmd(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'}
function hm(t){var p=String(t).split(':');return +p[0]*60+ +p[1]}
function hmStr(m){m=Math.max(0,Math.min(24*60-1,Math.round(m)));return pad(Math.floor(m/60))+':'+pad(m%60)}
function fmtMin(m){m=Math.round(m||0);var h=Math.floor(m/60),r=m%60;return h+':'+pad(r)+' h'}
function fmtH(m){var h=(m||0)/60;return (Math.round(h*10)/10).toString().replace('.',',')+' h'}
function daysUntil(s){return Math.round((parseYmd(s)-parseYmd(today()))/864e5)}
function isoWeek(s){var d=parseYmd(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(x){return JSON.parse(JSON.stringify(x))}

/* ---------- Daten ---------- */
function sem(){return S.settings.semester||{lectStart:'2026-10-01',lectEnd:'2027-01-22',breaks:[['2026-12-24','2027-01-06']],examStart:'2027-01-23',examEnd:'2027-02-06'}}
/* Bereiche: Studium ist der bisherige Lernplan, alles andere sind Projekte */
var AREAS={studium:{n:'Studium',h:210},arbeit:{n:'Arbeit',h:30},gym:{n:'Gym & Sport',h:140},projekt:{n:'Projekte',h:265},hobby:{n:'Hobbys',h:330},sozial:{n:'Soziales & Neues',h:15}};
var AREA_ORDER=['gym','projekt','hobby','sozial','arbeit','studium'];
function areaOf(m){return m&&m.area&&AREAS[m.area]?m.area:'studium'}
function isStudy(m){return areaOf(m)==='studium'}
function studyMods(){return mods().filter(isStudy)}
function projMods(){return mods().filter(function(m){return !isStudy(m)})}
function atag(a){return '<span class="atag" style="--ah:'+AREAS[a].h+'">'+esc(AREAS[a].n)+'</span>'}
function lvlNeed(n){return 50*(n-1)*n}
var LVNAMES=['Einsteiger','Starter','Dranbleiber','Macher','Durchzieher','Profi','Meister','Legende'];
function xpInfo(){
  var min=sumMin(function(){return true}),steps=0;mods().forEach(function(m){(m.path||[]).forEach(function(x){if(x.done)steps++})});
  var xp=Math.floor(min/10)+steps*25,lv=1;while(xp>=lvlNeed(lv+1))lv++;
  var a=lvlNeed(lv),b=lvlNeed(lv+1);return {xp:xp,lv:lv,title:LVNAMES[Math.min(lv-1,LVNAMES.length-1)],cur:xp-a,need:b-a,p:Math.round(100*(xp-a)/(b-a))};
}
function streak(){var days={};logsArr().forEach(function(l){days[l.date]=1});var t=today(),d=t,n=0;if(!days[d])d=addDays(d,-1);while(days[d]){n++;d=addDays(d,-1)}return {n:n,today:!!days[t]}}
function lastLog(mid){var r=null;logsArr().forEach(function(l){if(l.moduleId===mid&&(!r||l.date>r))r=l.date});return r}
function nextStep(m){var p=m.path||[];for(var i=0;i<p.length;i++)if(!p[i].done)return {i:i,t:p[i].t};return null}
function mods(){return Object.keys(S.modules).map(function(id){var m=S.modules[id];m.id=id;return m}).filter(function(m){return !m.archived}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'')})}
function modOf(id){return S.modules[id]||{name:'?',short:'?',hue:210}}
function pct(m){var p=m.path||[];if(!p.length)return 0;return Math.round(100*p.filter(function(x){return x.done}).length/p.length)}
function logsArr(){return Object.keys(S.logs).map(function(id){var l=S.logs[id];l.id=id;return l})}
function studyArr(){return Object.keys(S.study).map(function(id){var b=S.study[id];b.id=id;return b})}
function sumMin(f){return logsArr().filter(f).reduce(function(a,l){return a+(+l.minutes||0)},0)}
function dur(b){return Math.max(0,hm(b.end)-hm(b.start))}
function weekRange(mon){mon=mon||mondayOf(today());return [mon,addDays(mon,6)]}
function plannedFromBlocks(mid){return studyArr().filter(function(b){return b.moduleId===mid}).reduce(function(a,b){return a+dur(b)},0)}
function plannedTotal(m){return m.plannedTotal!=null&&m.plannedTotal!==''?(+m.plannedTotal)*60:plannedFromBlocks(m.id)}
function plannedWeek(m){if(m.weeklyHours!=null&&m.weeklyHours!=='')return (+m.weeklyHours)*60;var r=weekRange();return studyArr().filter(function(b){return b.moduleId===m.id&&b.date>=r[0]&&b.date<=r[1]}).reduce(function(a,b){return a+dur(b)},0)}
function overallContent(){var l=studyMods();if(!l.length)return 0;return Math.round(l.reduce(function(a,m){return a+pct(m)},0)/l.length)}
function inBreak(d){return (sem().breaks||[]).some(function(r){return d>=r[0]&&d<=r[1]})}
function lecturesOn(d){
  var wd=wday(d);
  return Object.keys(S.blocks).map(function(id){var b=S.blocks[id];b.id=id;return b}).filter(function(b){
    if(b.day!==wd)return false;if(b.from&&d<b.from)return false;if(b.to&&d>b.to)return false;
    if(inBreak(d))return false;if((b.skip||[]).indexOf(d)>=0)return false;return !(S.modules[b.moduleId]||{}).archived;
  });
}
function studyOn(d){return studyArr().filter(function(b){return b.date===d&&!(S.modules[b.moduleId]||{}).archived})}
function eventsOn(d){
  var out=[];
  mods().forEach(function(m){(m.dates||[]).forEach(function(x){if(x.date===d)out.push({label:(m.short||m.name)+': '+x.label,mod:m.id})})});
  (S.settings.events||[]).forEach(function(e){if(e.date===d)out.push({label:e.label})});
  return out;
}
function saveErr(e){console.error(e);toast('Speichern hat nicht geklappt. Bitte versuch es noch einmal.')}
function toast(t){S.upMsg=t;render();setTimeout(function(){if(S.upMsg===t){S.upMsg='';render()}},6000)}
function upd(path,data){return S.db.doc(path).update(data).catch(saveErr)}
function findMaterial(assetId){var r=null;mods().forEach(function(m){(m.materials||[]).forEach(function(x){if(x.assetId===assetId)r={m:m,x:x}})});return r}

/* ---------- Rendering ---------- */
function render(){
  if(S.dragging||S.touching){S.pendingRender=true;return}
  renderOverall();renderTimerChip();
  var tabs=[['today','Heute'],['coach','Coach'],['week','Woche'],['modules','Studium'],['projects','Projekte'],['tracker','Stunden']];
  $('tabs').innerHTML=tabs.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+ICO[t[0]]+'<span>'+t[1]+'</span></button>'}).join('');
  renderToast();
  var el=$('main');
  if(!S.loaded){el.innerHTML='<div class="skel"><i></i><i class="tall"></i><span>Lade Daten …</span></div>';return}
  var msg='';
  if(S.tab==='today')el.innerHTML=todayView();
  else if(S.tab==='coach')el.innerHTML=coachView();
  else if(S.tab==='projects')el.innerHTML=projectList();
  else if(!mods().length)el.innerHTML='<div class="empty">Noch nichts gespeichert. Leg im Tab „Projekte“ etwas an oder schreib Claude, welche Module du belegst.</div>';
  else if(S.tab==='week')el.innerHTML=msg+weekView();
  else if(S.tab==='modules')el.innerHTML=msg+moduleList();
  else el.innerHTML=msg+trackerView();
  if(S.mod&&S.modules[S.mod])renderModPanel();
  if(!$('chat').hidden)renderChat(false);
}
/* Nur Darstellung: Symbole, Ringe, Hinweis unten */
var ICO={
  coach:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  today:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
  projects:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  week:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  modules:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  tracker:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  prev:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>'
};
function ring(p,col,soft){var r=24,c=2*Math.PI*r,f=Math.max(0,Math.min(100,p))/100*c;
  return '<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="'+r+'" fill="none" stroke="var('+soft+')" stroke-width="7"/><circle cx="30" cy="30" r="'+r+'" fill="none" stroke="var('+col+')" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+f.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 30 30)"/></svg>'}
function modCode(m){var s=String(m.short||m.name||'?').trim(),d=s.match(/\d/);
  if(d)return (s.charAt(0)+d[0]).toUpperCase();if(s.length<=4)return s.toUpperCase();return s.slice(0,3).toUpperCase()}
function renderToast(){var el=$('toast');if(!el)return;var t=S.upMsg||'';
  if(!t){el.hidden=true;el.textContent='';return}
  el.hidden=false;el.className=/nicht geklappt|größer als|geht nicht|voll|Passwort|Fehler/i.test(t)?'err':'';el.textContent=t}
function renderOverall(){
  var c=overallContent(), l=mods(), done=sumMin(function(){return true}), plan=l.reduce(function(a,m){return a+plannedTotal(m)},0), hp=plan?Math.min(100,Math.round(100*done/plan)):0;
  var steps=0,sd=0;studyMods().forEach(function(m){(m.path||[]).forEach(function(x){steps++;if(x.done)sd++})});
  var ex=S.loaded?sem().examStart:null,n=ex?daysUntil(ex):-1;
  $('overall').innerHTML='<div class="ring">'+ring(c,'--accent','--accent-soft')+'<div class="rt"><span class="rl">Inhalt Studium</span><span class="rv">'+c+' %</span><span class="rs">'+sd+' von '+steps+' Schritten</span></div></div>'
    +'<div class="ring">'+ring(hp,'--hours','--hours-soft')+'<div class="rt"><span class="rl">Stunden gesamt</span><span class="rv">'+fmtH(done)+'<small> / '+fmtH(plan)+'</small></span><span class="rs">'+(n>0?'noch '+n+' Tage bis zu den Klausuren':n===0?'Klausurenphase beginnt heute':'')+'</span></div></div>';
}
function renderTimerChip(){
  var t=S.timer;$('timerchip').innerHTML=t?'<button class="timerchip" data-open="'+esc(t.mod)+'"><b>'+esc(modOf(t.mod).short||'')+'</b> <span class="tclock mono">'+clock(Math.floor((Date.now()-t.t)/1000))+'</span></button>':'';
}

function weekView(){
  var mon=S.week, colH=(END-START)*HPX, td=today(), o='', s=sem();
  var dates=[];for(var i=0;i<7;i++)dates.push(addDays(mon,i));
  o+='<div class="wkl"><div class="panel"><div class="weekbar"><div class="nav"><button class="rbtn" data-wk="-1" aria-label="Vorige Woche">'+ICO.prev+'</button>'
    +'<span class="lbl"><b>KW '+isoWeek(mon)+'</b><span>'+fmtShort(mon)+' – '+fmtDate(dates[6])+'</span></span><button class="rbtn" data-wk="1" aria-label="Nächste Woche">'+ICO.next+'</button>'
    +(mon!==mondayOf(td)?'<button class="btn today" data-wk="0">Heute</button>':'')+'</div>'
    +'<div class="nav"><button class="btn ghost" data-acct="1">Konto</button><button class="btn ghost" data-ics="1">Kalender-Export</button><button class="btn" data-newblock="1">+ Lernblock</button></div></div>';
  if(dates[6]>=s.examStart&&mon<=s.examEnd)o+='<div class="banner exam">Klausurenphase '+fmtShort(s.examStart)+'–'+fmtDate(s.examEnd)+'. Die genauen Termine kommen mit dem Prüfungsplan; dann plane ich die Lernblöcke rückwärts.</div>';
  else if(dates.some(inBreak))o+='<div class="banner">Weihnachtspause: keine Vorlesungen. Zeit für Altklausuren.</div>';
  else if(mon>s.examEnd)o+='<div class="banner">Das Semester ist vorbei.</div>';
  o+='<div class="daytabs">'+dates.map(function(d,i){return '<button data-day="'+i+'" aria-pressed="'+(S.day===i)+'"'+(d===td?' class="td"':'')+' aria-label="'+DAYS[i]+' '+fmtShort(d)+'">'+DAYS[i]+'<small>'+(+d.slice(8))+'</small></button>'}).join('')+'</div>';
  var sl=S.swipeDir>0?' slide-l':S.swipeDir<0?' slide-r':'';S.swipeDir=0;
  o+='<div class="weekwrap"><div class="week'+sl+'" style="--hpx:'+HPX+'px"><div></div>'+dates.map(function(d,i){
      var ev=eventsOn(d);
      return '<div class="dh'+(d===td?' today':'')+(i===S.day?' sel':'')+'"><b>'+DAYS[i]+'</b><span title="'+fmtShort(d)+'">'+(+d.slice(8))+'</span>'
        +(ev.length?'<div class="chips">'+ev.map(function(e){return '<button class="ev" '+(e.mod?'data-open="'+esc(e.mod)+'"':'')+' title="'+esc(e.label)+'">'+esc(e.label)+'</button>'}).join('')+'</div>':'')+'</div>'}).join('');
  var g='<div class="gutter" style="height:'+colH+'px">';for(var t=START;t<=END;t++)g+='<span class="mono" style="top:'+((t-START)*HPX)+'px">'+pad(t)+'</span>';o+=g+'</div>';
  dates.forEach(function(d,i){
    var items=lecturesOn(d).map(function(b){return {b:b,kind:b.kind,id:'L'+b.id}}).concat(studyOn(d).map(function(b){return {b:b,kind:'study',id:'S'+b.id}}));
    var cms=commutesOn(d).map(function(c){return {b:c,kind:'commute',id:'C'+c.id}});
    items.sort(function(a,b){return hm(a.b.start)-hm(b.b.start)});
    var lanes=layout(items);cms.forEach(function(c){lanes[c.id]={i:0,n:1}});items=cms.concat(items);
    o+='<div class="col'+(d===td?' today':'')+(inBreak(d)?' off':'')+(i===S.day?' sel':'')+'" data-date="'+d+'" style="height:'+colH+'px">';
    items.forEach(function(it){
      var b=it.b,m=modOf(b.moduleId),top=(hm(b.start)/60-START)*HPX,ht=Math.max(20,dur(b)/60*HPX-2),ln=lanes[it.id],w=100/ln.n;
      var style='--h:'+(m.hue||210)+';top:'+top+'px;height:'+ht+'px;left:calc('+(ln.i*w)+'% + 1px);width:calc('+w+'% - 2px)';
      var past=d<td||(d===td&&hm(b.end)<=new Date().getHours()*60+new Date().getMinutes());
      if(it.kind==='commute'){
        o+='<button class="blk commute" data-trset="1" style="top:'+top+'px;height:'+ht+'px;left:1px;width:calc(100% - 2px)" title="'+esc(b.label)+' '+esc(b.start)+'–'+esc(b.end)+'"><b>'+(b.dir==='hin'&&b.dep?'S-Bahn '+esc(b.dep)+' ab Grafing':'Heimfahrt')+'</b>'+(ht>34?'<span class="t">'+(b.dir==='hin'?'an Hochschule ca. '+esc(b.end):'ab Hackerbrücke, alle 20 min')+'</span>':'')+'</button>';return;
      }
      if(it.kind==='study'){
        var mark=b.done?'<span class="mark ok" aria-label="gelernt">'+ICO.check+'</span>':(past?'<span class="mark" aria-label="noch nicht bestätigt">?</span>':'');
        o+='<div class="blk study'+(b.done?' done':'')+(S.modules[b.moduleId]?'':' nomod')+'" role="button" tabindex="0" data-bid="'+esc(b.id)+'" style="'+style+'" title="'+esc(m.name)+' · Lernblock · verschieben durch Ziehen">'+mark
          +'<b>'+esc(m.short||m.name)+'</b><span class="t">'+esc(b.start)+'–'+esc(b.end)+'</span></div>';
      }else{
        o+='<button class="blk" data-open="'+esc(b.moduleId)+'" style="'+style+'" title="'+esc(m.name)+' · '+(KIND[b.kind]||'')+'"><b>'+esc(m.short||m.name)+'</b><span class="t">'+esc(b.start)+'–'+esc(b.end)+(ht>42?' · '+(KIND[b.kind]||''):'')+'</span></button>';
      }
    });
    o+='</div>';
  });
  o+='</div></div><div class="legend"><span><i></i>Vorlesung / Praktikum</span><span><i class="s"></i>Lernblock: ziehen zum Verschieben, tippen zum Bearbeiten</span><span>Leere Stelle antippen: neuer Lernblock</span><span>? = vorbei, noch nicht als gelernt bestätigt</span></div></div>';
  o+='<div class="grid2 wkside"><div class="panel"><h3>Nächste Termine</h3><ul class="plain" style="margin-top:12px">'+upcoming()+'</ul></div>'
     +'<div class="panel"><h3>Stunden in dieser Woche</h3>'+weekBox(mon)+'</div></div></div>';
  return o;
}
function layout(list){
  var res={},groups=[],cur=null,end=0;
  list.forEach(function(it){var s=hm(it.b.start),e=hm(it.b.end);if(!cur||s>=end){cur=[];groups.push(cur);end=0}cur.push(it);end=Math.max(end,e)});
  groups.forEach(function(g){var le=[];g.forEach(function(it){var s=hm(it.b.start),i=0;while(i<le.length&&le[i]>s)i++;le[i]=hm(it.b.end);res[it.id]={i:i,n:0}});g.forEach(function(it){res[it.id].n=le.length})});
  return res;
}
function upcoming(){
  var items=[],t=today();
  mods().forEach(function(m){(m.dates||[]).forEach(function(d){if(d.date)items.push({date:d.date,label:d.label,mod:m.short||m.name,id:m.id})})});
  (S.settings.events||[]).forEach(function(e){items.push({date:e.date,label:e.label,mod:''})});
  items=items.filter(function(i){return i.date>=t}).sort(function(a,b){return a.date<b.date?-1:1}).slice(0,8);
  if(!items.length)return '<li class="empty">Keine anstehenden Termine gespeichert.</li>';
  return items.map(function(i){var n=daysUntil(i.date);
    return '<li class="deadline"><span>'+(i.mod?'<b>'+esc(i.mod)+'</b> · ':'')+esc(i.label)+'</span><span class="when'+(n<=7?' soon':'')+'">'+fmtDate(i.date)+' · '+(n===0?'heute':n===1?'morgen':'in '+n+' T')+'</span></li>'}).join('');
}
function weekBox(mon){
  var r=weekRange(mon), done=sumMin(function(l){return l.date>=r[0]&&l.date<=r[1]});
  var plan=studyArr().filter(function(b){return b.date>=r[0]&&b.date<=r[1]}).reduce(function(a,b){return a+dur(b)},0);
  var p=plan?Math.min(100,Math.round(100*done/plan)):0;
  return '<div style="margin-top:12px"><div class="mono" style="font-size:22px">'+fmtH(done)+'<span class="muted" style="font-size:14px"> von '+fmtH(plan)+' geplant</span></div>'
    +'<div class="bar h'+(p>=100?' ok':'')+'"><i style="width:'+p+'%"></i></div>'
    +'<p class="hint">Geplant = Summe der Lernblöcke dieser Woche. Gelernt = Stoppuhr, nachgetragene Zeit und als gelernt bestätigte Lernblöcke.</p></div>';
}

function moduleList(){
  if(!studyMods().length)return '<div class="empty">Keine Studienmodule gespeichert.</div>';
  return '<div class="mcards">'+studyMods().map(function(m){
    var p=pct(m),tot=sumMin(function(l){return l.moduleId===m.id}),pl=plannedTotal(m),hp=pl?Math.min(100,Math.round(100*tot/pl)):0,nd=nextDate(m);

/* Fahrplan (offizieller Aushang Grafing Bahnhof, Mo–Fr): S-Bahn Richtung München tagsüber zur Minute :14, :34, :54.
   Fahrzeit S-Bahn Grafing Bf → Hackerbrücke rund 35 min, dann rund 15 min zu Fuß zur Lothstraße. Ohne Gewähr, ändert sich mit dem Fahrplanwechsel. */
var TT={mins:[14,34,54],from:5*60+14,to:22*60+54,ride:35,walk:15,buffer:5,backRide:35};
function s4Deps(fromMin,toMin){var r=[];for(var h=0;h<24;h++)TT.mins.forEach(function(m){var t=h*60+m;if(t>=TT.from&&t<=TT.to&&t>=fromMin&&t<=toMin)r.push(t)});return r}

function commutesOn(d){

  var first=Math.min.apply(null,l.map(function(b){return hm(b.start)})),last=Math.max.apply(null,l.map(function(b){return hm(b.end)}));
  var dep=trainFor(first),hs=dep!=null?dep:first-(+c.there||55),he=dep!=null?dep+TT.ride+TT.walk:first;
  return [{id:'hin-'+d,dir:'hin',date:d,start:hmStr(hs),end:hmStr(he),dep:dep!=null?hmStr(dep):null,label:dep!=null?'S-Bahn '+hmStr(dep)+' ab Grafing Bf':'Fahrt zur Hochschule'},
          {id:'rueck-'+d,dir:'rueck',date:d,start:hmStr(last),end:hmStr(last+(+c.back||55)),label:'Heimfahrt, S-Bahn ab Hackerbrücke'}];

/* ---------- Coach ----------
   coach/{id}: {type:'morning'|'evening'|'week', date, title, text, proposal?:[{moduleId,date,start,end}], applied?}
     wird von Claude zu festen Zeiten geschrieben. Morgens ab 6 Uhr sichtbar, abends und Wochenrückblick ab 20 Uhr, danach immer im Verlauf.

var CK={morning:{n:'Morgenbriefing',at:360},evening:{n:'Abendreview',at:1200},week:{n:'Wochenrückblick',at:1200}};
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function coachArr(){return Object.keys(S.coach||{}).map(function(id){var c=S.coach[id];c.id=id;return c})}
function coachVisible(c){var t=today();if(!c.date||c.date<t)return true;if(c.date>t)return false;return nowMin()>=((CK[c.type]||CK.morning).at)}
function coachOrder(a,b){var o={morning:0,evening:1,week:2};return a.date<b.date?1:a.date>b.date?-1:(o[a.type]||0)-(o[b.type]||0)}
function mdLite(src){
  var out=[],list=false;
  String(src||'').split(/\n/).forEach(function(line){
    var l=esc(line).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    var li=/^\s*[-•]\s+/.test(line);
    if(li&&!list){out.push('<ul>');list=true}
    if(!li&&list){out.push('</ul>');list=false}
    if(li)out.push('<li>'+l.replace(/^\s*[-•]\s+/,'')+'</li>');
    else if(/^#{1,4}\s/.test(line))out.push('<h4>'+l.replace(/^#{1,4}\s+/,'')+'</h4>');
    else if(line.trim())out.push('<p>'+l+'</p>');
  });
  if(list)out.push('</ul>');

/* Tippen und Ziehen (Maus, Finger, Stift)
   Finger: kurzes Tippen = Aktion, gedrückt halten (0,35 s) und ziehen = Lernblock verschieben, sonst scrollt die Seite.
   Aktionen bei Finger-Bedienung laufen direkt beim Loslassen, nicht über das click-Ereignis, weil iOS das click
   in eingebetteten Seiten oft verschluckt. Während ein Finger liegt, wird die Seite nicht neu gezeichnet. */
var ACT='[data-coach],[data-rate],[data-acct],[data-trdir],[data-trrefresh],[data-trset],[data-tblk],[data-quickdone],[data-newproj],[data-parea],[data-archive],[data-tab],[data-day],[data-wk],[data-open],[data-closemod],[data-askmod],[data-ask],[data-deltopic],[data-flip],[data-card],[data-timer],[data-dellog],[data-delmat],[data-deltool],[data-asset],[data-closeviewer],[data-newblock],[data-ics],[data-sheet],[data-chat],[data-sug],.col';
var drag=null,tap=null,lastTap=0,touchHold=null,swipe=null;
/* Wischen im Wochenplan: Handy einen Tag weiter/zurück (über Wochengrenzen), sonst eine Woche */
function doSwipe(dir){
  if(window.matchMedia&&matchMedia('(max-width:720px)').matches){
    var n=S.day+dir;if(n>6){S.week=addDays(S.week,7);n=0}else if(n<0){S.week=addDays(S.week,-7);n=6}S.day=n;
  }else S.week=addDays(S.week,7*dir);
  S.swipeDir=dir;render();
}
function flushRender(){S.touching=false;if(S.pendingRender&&!S.dragging){S.pendingRender=false;setTimeout(render,0)}}
document.addEventListener('pointerdown',function(e){
  if(e.button&&e.button>0)return;
  var touch=e.pointerType!=='mouse';
  var el=e.target.closest&&e.target.closest('.blk.study');
  if(touch){S.touching=true;clearTimeout(touchHold);touchHold=setTimeout(flushRender,4000)}
  swipe=touch&&S.tab==='week'&&e.target.closest&&e.target.closest('.week,.daytabs')?{x:e.clientX,y:e.clientY}:null;
  if(el){
    var r=el.getBoundingClientRect();
    drag={el:el,id:el.dataset.bid,x:e.clientX,y:e.clientY,offY:e.clientY-r.top,moved:false,pid:e.pointerId,touch:touch,armed:!touch,cancel:false};
    if(touch){drag.timer=setTimeout(function(){if(drag&&!drag.moved&&!drag.cancel){drag.armed=true;el.classList.add('lift');if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}}},350)}
    tap=null;return;
  }
  var a=touch&&e.target.closest&&e.target.closest(ACT);
  tap=a?{el:a,target:e.target,x:e.clientX,y:e.clientY}:null;
},true);
document.addEventListener('pointermove',function(e){
  if(tap&&Math.abs(e.clientX-tap.x)+Math.abs(e.clientY-tap.y)>12)tap=null;
  if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){
    if(Math.abs(dx)+Math.abs(dy)<(drag.touch?10:7))return;
    if(!drag.armed){drag.cancel=true;clearTimeout(drag.timer);var d0=drag;drag=null;d0.el.classList.remove('lift');return}
    drag.moved=true;S.dragging=true;drag.el.classList.add('dragging');try{drag.el.setPointerCapture(drag.pid)}catch(_){}
  }
  drag.el.style.transform='translate('+dx+'px,'+dy+'px)';e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',function(e){if(drag&&drag.armed)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.blk.study'))e.preventDefault()});
function endDrag(e,cancel){
  if(!drag)return false;var d=drag;drag=null;clearTimeout(d.timer);d.el.classList.remove('lift');
  if(!d.moved){if(!cancel&&!d.cancel){if(d.touch)lastTap=Date.now();openBlock(d.id)}return true}
  S.dragging=false;d.el.style.visibility='hidden';
  var col=null;if(!cancel){var els=document.elementsFromPoint(e.clientX,e.clientY);for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains('col')){col=els[i];break}}}
  var b=S.study[d.id];
  if(col&&b){
    var cr=col.getBoundingClientRect(),top=e.clientY-d.offY-cr.top,mins=START*60+Math.round(top/HPX*60/15)*15,len=dur(b);
    mins=Math.max(START*60,Math.min(END*60-len,mins));
    b.date=col.dataset.date;b.start=hmStr(mins);b.end=hmStr(mins+len);
    upd('study/'+d.id,{date:b.date,start:b.start,end:b.end});
  }
  if(d.touch)lastTap=Date.now();S.pendingRender=false;S.touching=false;render();return true;
}
document.addEventListener('pointerup',function(e){
  var t=tap;tap=null;var sw=swipe;swipe=null;
  if(sw&&!(drag&&drag.moved)){var dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy)){if(drag){clearTimeout(drag.timer);drag.el.classList.remove('lift');drag=null}S.touching=false;lastTap=Date.now();doSwipe(dx<0?1:-1);flushRender();return}}
  if(endDrag(e,false)){flushRender();return}
  if(t&&e.pointerType!=='mouse'){S.touching=false;lastTap=Date.now();try{act(t.el,t.target,e)}catch(err){console.error(err)}}
  flushRender();
});
document.addEventListener('pointercancel',function(e){tap=null;swipe=null;endDrag(e,true);flushRender()});
/* das nachfolgende click-Ereignis eines Fingertipps ignorieren, damit nichts doppelt passiert */
document.addEventListener('click',function(e){if(Date.now()-lastTap<800&&e.target.closest&&e.target.closest(ACT+',.blk.study')){e.preventDefault();e.stopPropagation()}},true);

/* ---------- Material, Lernpfad ---------- */
function doUpload(file){
  if(!file||!S.assets||!S.mod)return;var mod=S.mod;
  toast('Lade „'+file.name+'“ hoch …');
  uploadBig(file).then(function(r){
    var m=S.modules[mod],list=(m.materials||[]).slice(),path=(m.path||[]).slice();
    var it={title:file.name,type:'Upload',assetId:r.id,added:today()};if(r.parts){it.parts=r.parts;it.mime=r.mime;it.size=file.size}
    list.unshift(it);
    path.push({t:'Neu: „'+file.name.replace(/\.[a-z0-9]+$/i,'')+'“ durcharbeiten',done:false,refs:[r.id],auto:true});
    return S.db.doc('modules/'+mod).update({materials:list,path:path});
  }).then(function(){toast('„'+file.name+'“ gespeichert und als Schritt im Lernpfad ergänzt.'+(S.sample?' Mit „Lernpfad neu erstellen“ ordnet Claude sie sinnvoll ein.':''))})
  .catch(function(e){console.error(e);toast(e&&(e.code==='invalid_request'||e.code==='unsupported_type')?'Dieser Dateityp geht nicht. Erlaubt sind PDF und Bilder.':e&&e.code==='quota_or_state'?'Der Speicher der App ist voll.':e&&e.code==='too_large'?'Die Datei ist zu groß.':'Hochladen hat nicht geklappt. Versuch es noch einmal.')});
}
function removeMaterial(mid,idx){
  var m=S.modules[mid],ml=(m.materials||[]).slice(),it=ml[idx];ml.splice(idx,1);
  var path=(m.path||[]).map(function(s){return Object.assign({},s,{refs:(s.refs||[]).filter(function(r){return !it||r!==it.assetId})})}).filter(function(s){return !(s.auto&&!s.refs.length&&!s.done)});
  S.db.doc('modules/'+mid).update({materials:ml,path:path}).then(function(){if(!it||!S.assets)return;var ids=it.parts?it.parts.map(function(x){return x.id}):(it.assetId?[it.assetId]:[]);return Promise.all(ids.map(function(i){return S.assets.delete(i)}))}).catch(saveErr);
}

/* ---------- Viewer ---------- */
var textCache={};
function fetchBlob(id){return fetch('/_blob/'+encodeURIComponent(id)).then(function(r){if(!r.ok)throw new Error('Datei nicht gefunden ('+r.status+')');return r.blob()})}
function loadPdf(id){
  var f=findMaterial(id),parts=f&&f.x.parts;
  if(!parts||!parts.length)return fetchBlob(id);
  /* große Datei: Teile laden und wieder zusammensetzen */
  return Promise.all(parts.map(function(pt){return fetchBlob(pt.id).then(function(b){return pt.b64?b.text().then(b64ToBytes):b})}))
    .then(function(list){return new Blob(list,{type:f.x.mime||'application/pdf'})});
}
/* Große Dateien: die Plattform nimmt pro Datei höchstens 20 MiB. Größere Dateien werden in Teile zerlegt,
   einzeln gespeichert und beim Öffnen wieder zusammengesetzt. */
var PART=19*1024*1024,B64PART=14*1024*1024;
function bytesToB64(u8){var s='',C=0x8000;for(var i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)}
function b64ToBytes(t){var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function uploadBig(file){
  if(file.size<=20*1024*1024)return S.assets.upload(file).then(function(r){return {id:r.id}});
  var mime=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'');
  return file.arrayBuffer().then(function(buf){
    var u8=new Uint8Array(buf),cuts=[0],a=0;
    while(a+PART<u8.length){var b=a+PART;
      /* ein Teil darf nicht mit "<" (nach Leerzeichen) beginnen, sonst lehnt der Speicher ihn ab */
      while(b<u8.length&&(u8[b]===60||u8[b]===32||u8[b]===9||u8[b]===10||u8[b]===13||u8[b]===12))b++;
      cuts.push(b);a=b}
    cuts.push(u8.length);
    var parts=[],i=0;
    function next(){
      if(i>=cuts.length-1)return Promise.resolve();
      var chunk=u8.subarray(cuts[i],cuts[i+1]);i++;
      toast('Lade „'+file.name+'“ hoch … Teil '+i+' von '+(cuts.length-1));
      return S.assets.upload(new Blob([chunk],{type:mime}),{type:mime}).then(function(r){parts.push({id:r.id})})
        .catch(function(e){
          if(!e||e.code!=='unsupported_type')throw e;
          /* Notlösung: Teil als Text (Base64) speichern */
          var subs=[];for(var k=0;k<chunk.length;k+=B64PART)subs.push(chunk.subarray(k,k+B64PART));
          return subs.reduce(function(pr,sub){return pr.then(function(){return S.assets.upload(new Blob([bytesToB64(sub)],{type:'text/plain'}),{type:'text/plain'}).then(function(r){parts.push({id:r.id,b64:true})})})},Promise.resolve());
        }).then(next);
    }
    return next().then(function(){return {id:parts[0].id,parts:parts,mime:mime}})
      .catch(function(e){parts.forEach(function(x){S.assets.delete(x.id).catch(function(){})});throw e});
  });
}
function pdfDoc(buf){
  if(!window.pdfjsLib)throw new Error('PDF-Anzeige konnte nicht geladen werden');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return pdfjsLib.getDocument({data:buf}).promise;
}
function openAsset(id,name){
  var v=$('viewer');v.hidden=false;
  v.innerHTML='<div class="lbar"><span class="ltitle">'+esc(name)+'</span><button class="btn ghost" data-closeviewer="1">Schließen</button></div><div class="lbody"><div class="empty">Lade …</div></div>';
  var body=v.querySelector('.lbody');
  loadPdf(id).then(function(b){
    if(/^image\//.test(b.type)){body.innerHTML='';var im=document.createElement('img');im.src=URL.createObjectURL(b);im.alt=name;im.style.width='100%';body.appendChild(im);return}
    return b.arrayBuffer().then(pdfDoc).then(function(pdf){
      body.innerHTML='';
      var obs=new IntersectionObserver(function(entries){entries.forEach(function(en){
        if(!en.isIntersecting)return;var box=en.target;obs.unobserve(box);
        pdf.getPage(+box.dataset.p).then(function(page){
          var w=box.clientWidth||body.clientWidth,vp0=page.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),vp=page.getViewport({scale:(w/vp0.width)*dpr}),cv=document.createElement('canvas');
          cv.width=vp.width;cv.height=vp.height;cv.style.width='100%';cv.style.display='block';box.style.minHeight='';box.textContent='';box.appendChild(cv);
          return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        }).catch(function(e){box.textContent='Seite '+box.dataset.p+' konnte nicht angezeigt werden.';console.error(e)});
      })},{root:body,rootMargin:'600px 0px'});
      for(var i=1;i<=pdf.numPages;i++){var box=document.createElement('div');box.className='vpage';box.dataset.p=i;box.style.minHeight='480px';body.appendChild(box);obs.observe(box)}
    });
  }).catch(function(e){
    console.error(e);var pw=e&&e.name==='PasswordException';
    body.innerHTML='<div class="empty">'+(pw?'Diese PDF ist passwortgeschützt und kann in der App nicht geöffnet werden.':'Die Datei lässt sich nicht anzeigen ('+esc(e&&e.message||'Fehler')+').')+'</div>';
  });
}
function materialText(id,maxChars){
  maxChars=Math.min(+maxChars||40000,60000);
  if(textCache[id])return Promise.resolve(textCache[id].slice(0,maxChars));
  return loadPdf(id).then(function(b){if(!/pdf/.test(b.type)&&!/\.pdf/i.test(id))throw new Error('Nur PDFs können gelesen werden');return b.arrayBuffer()}).then(pdfDoc).then(function(pdf){
    var out=[],n=pdf.numPages,chain=Promise.resolve(),len=0;
    for(var i=1;i<=n;i++)(function(i){chain=chain.then(function(){if(len>60000)return;return pdf.getPage(i).then(function(p){return p.getTextContent()}).then(function(tc){var s=tc.items.map(function(x){return x.str}).join(' ').replace(/\s+/g,' ');out.push('[Seite '+i+'] '+s);len+=s.length})})})(i);
    return chain.then(function(){var t=out.join('\n');textCache[id]=t;return t.slice(0,maxChars)});
  }).catch(function(e){if(e&&e.name==='PasswordException')throw new Error('PDF ist passwortgeschützt');throw e});
}

/* ---------- Chat mit Claude ---------- */
function openChat(prefill,send){
  var c=$('chat');c.hidden=false;renderChat(true);
  if(prefill){var ta=$('chatbox');ta.value=prefill;if(send)sendChat();else ta.focus()}
}
function renderChat(focus){

  var ctx=S.mod&&S.modules[S.mod]?S.modules[S.mod]:null;
  var sugs=['Verschieb meine Lernblöcke diese Woche von Freitag auf Samstag','Erstelle 15 Karteikarten aus dem Skript','Was ist diese Woche am wichtigsten?','Füge das Modul Maschinenelemente hinzu'];
  c.innerHTML='<div class="lbar"><span class="ltitle">Claude'+(ctx?' · '+esc(ctx.short||ctx.name):'')+'</span><div class="frow" style="flex-wrap:nowrap"><button class="btn ghost" data-chat="new">Neu</button><button class="btn ghost" data-chat="close">Schließen</button></div></div>'
    +'<div class="lbody"><div class="msgs" id="msgs">'+(msgs||'<div class="muted small">Sag mir, was ich in deinem Lernplan ändern oder erstellen soll. Ich kann Lernblöcke verschieben, Module und Termine ändern, deine PDFs lesen und daraus Lernpfade, Zusammenfassungen und Karteikarten bauen. Jede Antwort nutzt dein Claude-Kontingent; beim ersten Mal fragt die App um Erlaubnis.</div><div class="sugs">'+sugs.map(function(s){return '<button data-sug="'+esc(s)+'">'+esc(s)+'</button>'}).join('')+'</div>')+'</div></div>'
    +'<form class="chatin" data-chatform="1"><textarea id="chatbox" placeholder="Nachricht an Claude" aria-label="Nachricht an Claude"></textarea>'
    +(S.busy?'<button type="button" class="btn ghost" data-chat="stop">Stopp</button>':'<button class="btn">Senden</button>')+'</form>';
  $('chatbox').value=draft;var b=c.querySelector('.lbody');b.scrollTop=b.scrollHeight;if(focus)try{$('chatbox').focus()}catch(e){}
}
function chatPush(role,text){S.chatLog.push({role:role,text:text});if(S.chatLog.length>80)S.chatLog.shift();renderChat(false);return S.chatLog[S.chatLog.length-1]}
function rules(){
  var ctx=S.mod&&S.modules[S.mod]?'Gerade geöffnet ist das Modul "'+S.modules[S.mod].name+'" (id '+S.mod+').':'Kein Modul geöffnet.';
  var w=S.week;
  return 'Du bist Claude, der Assistent in Tobis Planer-App für Studium (Wirtschaftsingenieurwesen, Hochschule München, WS 2026/27), Sport, Hobbys und eigene Projekte. Tobi fährt mit dem Zug von Grafing Bahnhof zur Hochschule München (Lothstraße 34); die App plant an Vorlesungstagen automatisch die Fahrzeit vor der ersten und nach der letzten Vorlesung ein (Einstellung settings.commute). Module und Projekte liegen beide unter "modules"; area sagt, was es ist (studium, gym, projekt, hobby, arbeit). Bei Projekten ist path die Liste der Meilensteine. Heute ist '+fmtDate(today())+' ('+DAYS[wday(today())]+'). Angezeigte Woche: ab '+fmtDate(w)+'. '+ctx
   +'\nRegeln: Antworte auf Deutsch, kurz und einfach. Ändere Daten nur über die Tools und nur, wenn Tobi es möchte oder es eindeutig zur Bitte gehört. Lies Material mit read_material, bevor du Inhalte daraus behauptest; erfinde nichts. Karteikarten: knapp, eine Frage pro Karte, Antwort in 1-3 Sätzen. Zusammenfassungen: gegliedert mit Überschriften und Spiegelstrichen, klausurrelevant. Lernpfade: 6-15 Schritte in sinnvoller Reihenfolge, jeder Schritt verweist mit refs auf die passenden assetIds; erledigte Schritte behalten done=true. Module entfernst du mit archive_module (umkehrbar). Datumsformat in Tools: YYYY-MM-DD, Zeiten HH:MM. Sag am Ende in einem Satz, was du geändert hast.';

function sendChat(){
  if(S.busy||!S.sample)return;var ta=$('chatbox'),q=(ta.value||'').trim();if(!q)return;ta.value='';
  chatPush('user',q);S.chat.push({role:'user',content:q});
  S.busy=true;var bubble=chatPush('assistant','Denke nach …');S.ctl=new AbortController();
  var input=[{role:'user',content:rules()+'\n\nVerstanden? Dann folgt das Gespräch.'},{role:'assistant',content:'Verstanden.'}].concat(S.chat.slice(-16));
  S.sample(input,{tools:chatTools(),cache:false,signal:S.ctl.signal,onText:function(u){bubble.text=u.text;var el=$('msgs');if(el){var last=el.querySelectorAll('.msg.assistant');last=last[last.length-1];if(last)last.textContent=u.text;var b=$('chat').querySelector('.lbody');b.scrollTop=b.scrollHeight}}})
  .then(function(r){bubble.text=r.text+(r.truncated?'\n\n(Antwort wurde gekürzt.)':'');S.chat.push({role:'assistant',content:r.text})})
  .catch(function(e){
    var msg={not_granted:'Du hast den Zugriff auf Claude nicht erlaubt. Lade die Seite neu, um es nochmal zu versuchen.',rate_limited:'Gerade zu viele Anfragen. Warte kurz und versuch es nochmal.',sampling_disabled:'Claude ist für diese App gerade nicht verfügbar.',cancelled:'Gestoppt.',prompt_too_large:'Das war zu viel Text auf einmal. Starte einen neuen Chat oder frag nach weniger.',session_expired:'Deine Anmeldung ist abgelaufen. Lade die Seite neu.'}[e&&e.code]||'Das hat nicht geklappt ('+(e&&e.code||'Fehler')+').';
    bubble.text=(e&&e.text?e.text+'\n\n':'')+msg;S.chat.pop();
  }).then(function(){S.busy=false;renderChat(false)});
}
